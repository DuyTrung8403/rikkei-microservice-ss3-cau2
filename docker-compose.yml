version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ss3-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d
      - ss3_pgdata:/var/lib/postgresql/data
    networks:
      - ss3-network

  customer-service:
    build:
      context: ./customer-service
    container_name: ss3-customer-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/customer_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=123456
    depends_on:
      - postgres
    networks:
      - ss3-network

networks:
  ss3-network:
    driver: bridge

volumes:
  ss3_pgdata:
